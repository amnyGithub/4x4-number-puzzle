<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Shadow Echo — Number Arcade</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#dff;font-family:system-ui,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%;background:#000;cursor:crosshair}
.hud{position:fixed;top:0;left:0;right:0;padding:16px 18px;pointer-events:none;display:flex;justify-content:space-between;align-items:center;text-shadow:0 0 14px #5eeaff;z-index:2}
.hud strong{font-size:clamp(18px,4vw,28px);letter-spacing:3px}.hud span{font-size:16px;opacity:.9}
.help{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);color:#8bd8e8;pointer-events:none;text-align:center;font-size:13px;letter-spacing:.5px;text-shadow:0 0 10px #0af;z-index:2;white-space:nowrap}
.status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-weight:700;font-size:clamp(18px,5vw,32px);letter-spacing:5px;color:#cfffff;text-shadow:0 0 10px #fff,0 0 28px #00dfff;opacity:0;pointer-events:none;z-index:3;transition:opacity .12s;text-align:center}
.status.show{opacity:1}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud"><strong>SHADOW ECHO</strong><span id="score">Echoes: 0</span></div>
<div id="status" class="status">ECHO FOUND</div>
<div class="help">Tap or click anywhere to send a sonar pulse • Find the hidden echoes</div>
<script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false}),scoreEl=document.getElementById('score'),statusEl=document.getElementById('status');
let W=0,H=0,dpr=1,pulses=[],targets=[],reveals=[],stars=[],score=0,audioCtx=null,statusTimer=0;
const TAU=Math.PI*2;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);makeTargets();makeStars()}
function makeStars(){stars=[];const count=Math.max(35,Math.floor(W*H/13000));for(let i=0;i<count;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:.4+Math.random()*1.2,a:.18+Math.random()*.45})}
function makeTargets(){targets=[];const count=Math.max(6,Math.min(12,Math.floor(W*H/80000)));for(let i=0;i<count;i++){let x,y,r=12+Math.random()*15,ok=false;for(let n=0;n<60&&!ok;n++){x=35+Math.random()*Math.max(1,W-70);y=90+Math.random()*Math.max(1,H-145);ok=targets.every(t=>Math.hypot(t.x-x,t.y-y)>90)}if(ok)targets.push({x,y,r,hit:false})}}
function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}
function ping(){ensureAudio();const o=audioCtx.createOscillator(),g=audioCtx.createGain(),now=audioCtx.currentTime;o.type='sine';o.frequency.setValueAtTime(800,now);o.frequency.exponentialRampToValueAtTime(200,now+.3);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.18,now+.015);g.gain.exponentialRampToValueAtTime(.0001,now+.3);o.connect(g).connect(audioCtx.destination);o.start(now);o.stop(now+.31)}
function chime(){ensureAudio();const now=audioCtx.currentTime;[660,990,1320].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.value=f;const t=now+i*.055;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.14,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.3);o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+.32)})}
function showFound(){statusEl.classList.add('show');clearTimeout(statusTimer);statusTimer=setTimeout(()=>statusEl.classList.remove('show'),520)}
function fire(x,y){ping();pulses.push({x,y,t:performance.now(),hit:new Set()});}
function pointer(e){e.preventDefault();const r=canvas.getBoundingClientRect();fire(e.clientX-r.left,e.clientY-r.top)}
canvas.addEventListener('pointerdown',pointer,{passive:false});addEventListener('resize',resize);resize();
function targetPath(t){ctx.beginPath();ctx.moveTo(t.x,t.y-t.r);for(let i=1;i<=10;i++){const a=-Math.PI/2+i*TAU/10;const rr=i%2?t.r*.45:t.r;ctx.lineTo(t.x+Math.cos(a)*rr,t.y+Math.sin(a)*rr)}ctx.closePath()}
function drawStars(){for(const s of stars){ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,TAU);ctx.fillStyle=`rgba(110,210,255,${s.a})`;ctx.fill()}}
function frame(now){ctx.clearRect(0,0,W,H);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);drawStars();
for(let i=pulses.length-1;i>=0;i--){const p=pulses[i],age=(now-p.t)/1000;if(age>=1.5){pulses.splice(i,1);continue}const q=age/1.5,r=q*Math.hypot(W,H),alpha=1-q;
ctx.beginPath();ctx.arc(p.x,p.y,Math.max(2,r),0,TAU);ctx.strokeStyle=`rgba(60,235,255,${Math.min(1,alpha*.95)})`;ctx.lineWidth=3;ctx.shadowBlur=28;ctx.shadowColor='#00dfff';ctx.stroke();
ctx.beginPath();ctx.arc(p.x,p.y,4+10*(1-q),0,TAU);ctx.fillStyle=`rgba(180,255,255,${alpha})`;ctx.shadowBlur=20;ctx.fill();ctx.shadowBlur=0;
for(const t of targets){if(p.hit.has(t))continue;const d=Math.hypot(t.x-p.x,t.y-p.y);if(Math.abs(d-r)<=Math.max(9,t.r*.75)){p.hit.add(t);t.hit=true;reveals.push({t,until:now+1100});score++;scoreEl.textContent='Echoes: '+score;showFound();chime()}}
}
for(let i=reveals.length-1;i>=0;i--){const v=reveals[i],left=v.until-now;if(left<=0){reveals.splice(i,1);continue}const a=Math.min(1,left/350);ctx.save();ctx.globalAlpha=a;ctx.strokeStyle='#bfffff';ctx.shadowColor='#00eaff';ctx.shadowBlur=32;ctx.lineWidth=3;targetPath(v.t);ctx.stroke();ctx.beginPath();ctx.arc(v.t.x,v.t.y,v.t.r*.18,0,TAU);ctx.fillStyle='#fff';ctx.fill();ctx.restore()}
requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
</body>
</html>
