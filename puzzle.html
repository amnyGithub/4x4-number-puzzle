<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4×4 Number Puzzle</title><style>:root{--tile:#38bdf8;--tile2:#0284c7}body{margin:0;min-height:100vh;font-family:system-ui,sans-serif;color:#f8fafc;background:radial-gradient(circle at top,#1e3a5f,#0f172a 55%);display:flex;justify-content:center;padding:18px}.app{width:min(720px,100%)}header{text-align:center}.back{color:#fbbf24;text-decoration:none}.panel{background:#1e293bee;border:1px solid #334155;border-radius:22px;padding:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}.stat{background:#0f172a;border-radius:13px;padding:10px;text-align:center}.stat b{display:block;font-size:1.25rem}.stat span{font-size:.75rem;color:#94a3b8}.board{width:min(88vw,520px);aspect-ratio:1;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tile{border:0;border-radius:14px;background:linear-gradient(145deg,var(--tile),var(--tile2));color:white;font-size:clamp(1.3rem,7vw,2.3rem);font-weight:800;cursor:pointer;box-shadow:0 5px 0 #075985;transition:.12s}.tile:active{transform:translateY(2px)}.empty{background:#0b1220;border:2px dashed #334155;box-shadow:none}.controls{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:16px 0}.control{border:1px solid #475569;background:#334155;color:white;border-radius:11px;padding:9px 13px;cursor:pointer}.primary{background:#fbbf24;color:#111827;font-weight:800}.message{text-align:center;min-height:25px;color:#fbbf24;font-weight:700}.help{text-align:center;color:#94a3b8;font-size:.8rem}.user{text-align:center;color:#94a3b8;margin:10px}.home{display:block;text-align:center;margin:15px;color:#fbbf24}</style></head><body><main class="app"><header><a class="back" href="index.html">← Number Arcade</a><h1>🔢 4×4 Number Puzzle</h1><p>Arrange 1–15 in order.</p></header><section class="panel"><div class="user" id="user">Playing as guest</div><div class="stats"><div class="stat"><b id="moves">0</b><span>MOVES</span></div><div class="stat"><b id="time">00:00</b><span>TIME</span></div><div class="stat"><b id="best">—</b><span>BEST</span></div></div><div id="board" class="board"></div><div id="message" class="message"></div><div class="controls"><button class="control primary" id="new">New Game</button><button class="control" id="undo">↶ Undo</button><button class="control" id="hint">💡 Hint</button><select class="control" id="difficulty"><option value="easy">Easy</option><option value="normal" selected>Normal</option><option value="hard">Hard</option><option value="expert">Expert</option></select></div><div class="help">Tap tiles or use arrow keys. Only solvable puzzles are generated.</div></section><a class="home" href="index.html#leaderboard">🏆 View Global Leaderboard</a></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const sb=createClient('https://uesymduyouwdrjedzqfr.supabase.co','sb_publishable_6uWbMVr4O7NEfPLFBPpejQ_rnpcR2M2');const $=id=>document.getElementById(id),solved=[...Array(15)].map((_,i)=>i+1).concat(0),steps={easy:40,normal:150,hard:400,expert:1000};let state=[...solved],history=[],moves=0,seconds=0,timer=null,running=false;function neigh(p){let r=Math.floor(p/4),c=p%4,a=[];if(r)a.push(p-4);if(r<3)a.push(p+4);if(c)a.push(p-1);if(c<3)a.push(p+1);return a}function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function render(){$('board').innerHTML='';state.forEach((n,i)=>{let b=document.createElement('button');b.className='tile'+(n?'':' empty');b.textContent=n||'';if(n)b.onclick=()=>move(i);$('board').appendChild(b)});$('moves').textContent=moves;$('time').textContent=fmt(seconds)}function move(i){if(!running)return;let z=state.indexOf(0);if(!neigh(z).includes(i))return;history.push([...state]);[state[z],state[i]]=[state[i],state[z]];moves++;render();if(state.every((v,i)=>v===solved[i]))win()}function start(){clearInterval(timer);timer=setInterval(()=>{if(running){seconds++;$('time').textContent=fmt(seconds)}},1000)}function shuffle(){state=[...solved];history=[];let last=-1,n=steps[$('difficulty').value];for(let k=0;k<n;k++){let z=state.indexOf(0),a=neigh(z).filter(x=>x!==last),i=a[Math.floor(Math.random()*a.length)];[state[z],state[i]]=[state[i],state[z]];last=z}moves=0;seconds=0;running=true;$('message').textContent='';render();start()}async function currentUser(){let{data}=await sb.auth.getUser();if(data.user){let{data:p}=await sb.from('profiles').select('username').eq('id',data.user.id).maybeSingle();$('user').textContent='Playing as '+(p?.username||data.user.email);return data.user}return null}async function win(){running=false;clearInterval(timer);$('message').textContent=`🎉 Solved in ${moves} moves!`;let u=await currentUser();if(!u){$('message').textContent+=' Log in to appear on the global leaderboard.';return}let{data:p}=await sb.from('profiles').select('username').eq('id',u.id).maybeSingle();let{error}=await sb.from('scores').insert({user_id:u.id,username:p?.username||u.email,game:'4x4',difficulty:$('difficulty').value,moves,seconds});if(error)$('message').textContent+=' Score could not be submitted yet.';else $('message').textContent+=' 🏆 Score submitted!'}$('new').onclick=shuffle;$('undo').onclick=()=>{if(running&&history.length){state=history.pop();moves--;render()}};$('hint').onclick=()=>{if(!running)return;let z=state.indexOf(0),i=neigh(z)[0];$('board').children[i].animate([{transform:'scale(1)'},{transform:'scale(1.12)'},{transform:'scale(1)'}],{duration:450})};$('difficulty').onchange=shuffle;document.onkeydown=e=>{if(!running)return;let z=state.indexOf(0),r=Math.floor(z/4),c=z%4,i=null;if(e.key==='ArrowUp'&&r<3)i=z+4;if(e.key==='ArrowDown'&&r>0)i=z-4;if(e.key==='ArrowLeft'&&c<3)i=z+1;if(e.key==='ArrowRight'&&c>0)i=z-1;if(i!==null){e.preventDefault();move(i)}};currentUser();shuffle();</script></body></html>
