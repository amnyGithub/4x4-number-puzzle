<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>4×4 Number Arranging Game</title>
<style>
:root{
  --bg:#0f172a; --panel:#1e293b; --tile:#38bdf8; --tile2:#0284c7;
  --text:#f8fafc; --muted:#94a3b8; --accent:#fbbf24; --gap:8px;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  background:radial-gradient(circle at top,#1e3a5f 0,#0f172a 55%);
  color:var(--text); display:flex; justify-content:center; align-items:center; padding:18px;
}
.app{width:min(720px,100%)}
header{text-align:center;margin-bottom:14px}
h1{margin:0;font-size:clamp(1.7rem,6vw,2.6rem)}
.subtitle{color:var(--muted);margin:5px 0 0}
.panel{
  background:rgba(30,41,59,.92); border:1px solid #334155; border-radius:22px;
  padding:18px; box-shadow:0 20px 50px #0005;
}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
.stat{background:#0f172a;border-radius:13px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.25rem}.stat span{font-size:.75rem;color:var(--muted)}
.board{
  width:min(88vw,520px); aspect-ratio:1; margin:0 auto; display:grid;
  grid-template-columns:repeat(4,1fr); gap:var(--gap); touch-action:manipulation;
}
.tile{
  border:0;border-radius:14px;background:linear-gradient(145deg,var(--tile),var(--tile2));
  color:white;font-size:clamp(1.3rem,7vw,2.3rem);font-weight:800;
  cursor:pointer; box-shadow:0 5px 0 #075985,0 8px 16px #0004;
  transition:transform .12s,filter .12s;
}
.tile:not(.empty):hover{filter:brightness(1.12);transform:translateY(-2px)}
.tile:not(.empty):active{transform:translateY(2px);box-shadow:0 2px 0 #075985}
.empty{background:#0b1220;border:2px dashed #334155;box-shadow:none;cursor:default}
.controls{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:16px 0 4px}
button,select,input{font:inherit}
.control{
  border:1px solid #475569;background:#334155;color:var(--text);border-radius:11px;
  padding:9px 13px;cursor:pointer
}
.control:hover{background:#475569}
.primary{background:var(--accent);color:#111827;border-color:var(--accent);font-weight:800}
details{margin-top:15px;border-top:1px solid #334155;padding-top:13px}
summary{cursor:pointer;font-weight:700}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:12px}
.setting{background:#0f172a;padding:10px;border-radius:12px}
.setting label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:5px}
.setting select,.setting input[type=range]{width:100%}
.message{text-align:center;min-height:24px;margin-top:10px;color:var(--accent);font-weight:700}
.help{text-align:center;color:var(--muted);font-size:.8rem;margin-top:9px}
kbd{background:#0b1220;border:1px solid #475569;border-radius:5px;padding:2px 5px}
.overlay{
 position:fixed;inset:0;background:#020617b8;display:none;align-items:center;justify-content:center;padding:20px
}
.modal{background:#1e293b;border:1px solid #475569;border-radius:20px;padding:26px;text-align:center;max-width:360px}
.modal h2{margin-top:0}
@media(max-width:430px){.panel{padding:12px}.tile{border-radius:10px}.stats{gap:6px}.stat{padding:7px}}
</style>
</head>
<body>
<main class="app">
<header>
  <h1>🔢 4×4 Number Puzzle</h1>
  <p class="subtitle">Arrange 1–15 in order using the empty space.</p>
</header>

<section class="panel">
  <div class="stats">
    <div class="stat"><b id="moves">0</b><span>MOVES</span></div>
    <div class="stat"><b id="time">00:00</b><span>TIME</span></div>
    <div class="stat"><b id="best">—</b><span>BEST MOVES</span></div>
  </div>

  <div id="board" class="board" aria-label="4 by 4 number puzzle"></div>

  <div id="message" class="message"></div>

  <div class="controls">
    <button class="control primary" id="newGame">New Game</button>
    <button class="control" id="shuffleAgain">Shuffle</button>
    <button class="control" id="undo">↶ Undo</button>
    <button class="control" id="hint">💡 Hint</button>
    <button class="control" id="pause">⏸ Pause</button>
  </div>

  <div class="help">
    Tap a tile, or use <kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd>.
    Only solvable puzzles are generated.
  </div>

  <details>
    <summary>⚙ Configuration</summary>
    <div class="settings">
      <div class="setting">
        <label for="difficulty">Difficulty</label>
        <select id="difficulty">
          <option value="easy">Easy — 40 shuffles</option>
          <option value="normal" selected>Normal — 150 shuffles</option>
          <option value="hard">Hard — 400 shuffles</option>
          <option value="expert">Expert — 1000 shuffles</option>
        </select>
      </div>
      <div class="setting">
        <label for="animation">Animation speed</label>
        <select id="animation">
          <option value="fast">Fast</option><option value="normal" selected>Normal</option><option value="slow">Slow</option>
        </select>
      </div>
      <div class="setting">
        <label for="sound">Sound</label>
        <select id="sound"><option value="on" selected>On</option><option value="off">Off</option></select>
      </div>
      <div class="setting">
        <label for="theme">Theme</label>
        <select id="theme">
          <option value="ocean" selected>Ocean</option><option value="purple">Purple</option>
          <option value="forest">Forest</option><option value="sunset">Sunset</option>
        </select>
      </div>
    </div>
  </details>
</section>
</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2>⏸ Paused</h2>
    <p>Your timer is paused.</p>
    <button class="control primary" id="resume">Resume</button>
  </div>
</div>

<script>
(() => {
  const boardEl=document.getElementById('board'), movesEl=document.getElementById('moves'),
        timeEl=document.getElementById('time'), bestEl=document.getElementById('best'),
        msgEl=document.getElementById('message'), overlay=document.getElementById('overlay');
  const difficulty=document.getElementById('difficulty'), animation=document.getElementById('animation'),
        sound=document.getElementById('sound'), theme=document.getElementById('theme');

  const solved=[...Array(15)].map((_,i)=>i+1).concat(0);
  let state=[...solved], history=[], moves=0, seconds=0, running=false, paused=false, timer=null, audioCtx=null;

  const shuffles={easy:40,normal:150,hard:400,expert:1000};

  function bestKey(){return 'puzzle4x4-best-'+difficulty.value}
  function loadBest(){const x=localStorage.getItem(bestKey());bestEl.textContent=x?x:'—'}
  function formatTime(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}

  function neighbors(pos){
    const r=Math.floor(pos/4),c=pos%4,a=[];
    if(r>0)a.push(pos-4);if(r<3)a.push(pos+4);if(c>0)a.push(pos-1);if(c<3)a.push(pos+1);
    return a;
  }
  function render(){
    boardEl.innerHTML='';
    state.forEach((n,i)=>{
      const b=document.createElement('button');
      b.className='tile'+(n===0?' empty':'');
      b.textContent=n||'';
      b.setAttribute('aria-label',n?`Tile ${n}`:'Empty space');
      if(n)b.addEventListener('click',()=>move(i));
      boardEl.appendChild(b);
    });
    movesEl.textContent=moves;timeEl.textContent=formatTime(seconds);
  }
  function beep(freq=500,duration=.05){
    if(sound.value==='off')return;
    try{
      audioCtx??=new (window.AudioContext||window.webkitAudioContext)();
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.frequency.value=freq;g.gain.value=.035;o.connect(g);g.connect(audioCtx.destination);
      o.start();o.stop(audioCtx.currentTime+duration);
    }catch(e){}
  }
  function move(i){
    if(!running||paused)return;
    const z=state.indexOf(0); if(!neighbors(z).includes(i))return;
    history.push([...state]); [state[z],state[i]]=[state[i],state[z]]; moves++;
    beep(420,.04); render();
    if(state.every((v,i)=>v===solved[i])) win();
  }
  function startTimer(){
    clearInterval(timer);timer=setInterval(()=>{if(running&&!paused){seconds++;timeEl.textContent=formatTime(seconds)}},1000)
  }
  function shuffle(){
    state=[...solved]; history=[]; let last=-1;
    for(let k=0;k<shuffles[difficulty.value];k++){
      const z=state.indexOf(0), opts=neighbors(z).filter(x=>x!==last);
      const i=opts[Math.floor(Math.random()*opts.length)];
      [state[z],state[i]]=[state[i],state[z]];last=z;
    }
    if(state.every((v,i)=>v===solved[i])) return shuffle();
    moves=0;seconds=0;running=true;paused=false;msgEl.textContent='';overlay.style.display='none';
    render();startTimer();
  }
  function newGame(){shuffle();loadBest()}
  function win(){
    running=false;clearInterval(timer);msgEl.textContent=`🎉 Solved in ${moves} moves!`;
    const old=Number(localStorage.getItem(bestKey())||Infinity);
    if(moves<old){localStorage.setItem(bestKey(),moves);bestEl.textContent=moves;msgEl.textContent+=' 🏆 New best!'}
    beep(880,.18);
  }
  document.getElementById('newGame').onclick=newGame;
  document.getElementById('shuffleAgain').onclick=shuffle;
  document.getElementById('undo').onclick=()=>{
    if(!running||paused||!history.length)return;
    state=history.pop();moves=Math.max(0,moves-1);render();beep(300,.04);
  };
  document.getElementById('hint').onclick=()=>{
    if(!running||paused)return;
    const z=state.indexOf(0), opts=neighbors(z);
    const target=opts.find(i=>state[i]!==0 && state[i]===z+1);
    const idx=target??opts[Math.floor(Math.random()*opts.length)];
    boardEl.children[idx]?.animate([{transform:'scale(1)'},{transform:'scale(1.12)'},{transform:'scale(1)'}],{duration:500});
    msgEl.textContent=target!==undefined?'💡 Try the highlighted tile.':'💡 Move any highlighted tile toward its correct position.';
  };
  document.getElementById('pause').onclick=()=>{
    if(!running)return;paused=true;overlay.style.display='flex';
  };
  document.getElementById('resume').onclick=()=>{paused=false;overlay.style.display='none'};
  difficulty.onchange=()=>{loadBest();newGame()};
  animation.onchange=()=>{
    const v={fast:'.08s',normal:'.12s',slow:'.22s'}[animation.value];
    document.documentElement.style.setProperty('--tile-speed',v);
    document.querySelectorAll('.tile').forEach(x=>x.style.transition=`transform ${v},filter ${v}`);
  };
  theme.onchange=()=>{
    const root=document.documentElement, themes={
      ocean:['#38bdf8','#0284c7'],purple:['#a78bfa','#7c3aed'],
      forest:['#4ade80','#16a34a'],sunset:['#fb923c','#ea580c']
    };
    root.style.setProperty('--tile',themes[theme.value][0]);root.style.setProperty('--tile2',themes[theme.value][1]);
  };
  document.addEventListener('keydown',e=>{
    if(!running||paused)return;
    const z=state.indexOf(0),r=Math.floor(z/4),c=z%4;
    let i=null;
    if(e.key==='ArrowUp'&&r<3)i=z+4;
    if(e.key==='ArrowDown'&&r>0)i=z-4;
    if(e.key==='ArrowLeft'&&c<3)i=z+1;
    if(e.key==='ArrowRight'&&c>0)i=z-1;
    if(i!==null){e.preventDefault();move(i)}
  });
  loadBest();newGame();
})();
</script>
</body>
</html>
