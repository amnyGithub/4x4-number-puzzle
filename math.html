<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick Math — Number Arcade</title><style>body{margin:0;min-height:100vh;font-family:system-ui,sans-serif;color:#f8fafc;background:radial-gradient(circle at 20% 0,#164e63,transparent 38%),radial-gradient(circle at 90% 20%,#312e81,transparent 35%),#07111f;display:flex;justify-content:center;padding:20px}.app{width:min(650px,100%)}a{color:#fbbf24;text-decoration:none}.panel{margin-top:20px;background:#101d31ee;border:1px solid #ffffff18;border-radius:24px;padding:25px;box-shadow:0 20px 60px #0005}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#07111f;border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:1.5rem}.stat span{font-size:.75rem;color:#94a3b8}.question{text-align:center;font-size:clamp(2.5rem,12vw,5rem);font-weight:900;margin:35px 0 20px}.answer{display:flex;gap:10px}.answer input{flex:1;min-width:0;padding:15px;border-radius:12px;border:1px solid #475569;background:#07111f;color:white;font-size:1.3rem;text-align:center}.btn{border:0;border-radius:12px;padding:13px 18px;background:#fbbf24;color:#111827;font-weight:900;cursor:pointer}.message{text-align:center;min-height:28px;color:#fbbf24;font-weight:700;margin:15px}.new{display:block;margin:auto}.help{text-align:center;color:#94a3b8;font-size:.85rem;margin-top:20px}</style></head><body><main class="app"><a href="index.html">← Number Arcade</a><h1>⚡ Quick Math</h1><p>Solve as many as you can in 60 seconds.</p><section class="panel"><div class="stats"><div class="stat"><b id="score">0</b><span>SCORE</span></div><div class="stat"><b id="time">60</b><span>SECONDS</span></div><div class="stat"><b id="streak">0</b><span>STREAK</span></div></div><div id="question" class="question">Ready?</div><div class="answer"><input id="answer" type="number" inputmode="numeric" placeholder="Answer"><button class="btn" id="submit">Start</button></div><div id="message" class="message"></div><button class="btn new" id="new">New Round</button><div class="help">Correct answers earn 10 points plus a streak bonus.</div></section></main><script>const $=id=>document.getElementById(id);let a=0,b=0,op='',score=0,streak=0,time=60,running=false,timer=null;function make(){let max=Math.min(30,10+Math.floor(score/30));a=2+Math.floor(Math.random()*max);b=1+Math.floor(Math.random()*max);let ops=['+','−','×'];op=ops[Math.floor(Math.random()*ops.length)];if(op==='−'&&b>a)[a,b]=[b,a];if(op==='×'){a=1+Math.floor(Math.random()*12);b=1+Math.floor(Math.random()*10)}$('question').textContent=`${a} ${op} ${b} = ?`;$('answer').value='';$('answer').focus()}function correct(){return op==='+'?a+b:op==='−'?a-b:a*b}function start(){clearInterval(timer);score=0;streak=0;time=60;running=true;$('score').textContent=score;$('streak').textContent=streak;$('time').textContent=time;$('message').textContent='Go!';$('submit').textContent='Answer';make();timer=setInterval(()=>{time--;$('time').textContent=time;if(time<=0){clearInterval(timer);running=false;$('question').textContent='Time!';$('message').textContent=`🏆 Final score: ${score}`;$('submit').textContent='Start'}},1000)}function check(){if(!running){start();return}let v=Number($('answer').value);if(!Number.isFinite(v)||$('answer').value==='')return;if(v===correct()){streak++;score+=10+Math.min(20,streak*2);$('message').textContent='✓ Correct!';}else{streak=0;$('message').textContent=`✗ Answer: ${correct()}`}$('score').textContent=score;$('streak').textContent=streak;make()}$('submit').onclick=check;$('new').onclick=start;$('answer').addEventListener('keydown',e=>{if(e.key==='Enter')check()});</script></body></html>
