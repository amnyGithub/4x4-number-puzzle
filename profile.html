<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Number Arcade — My Profile</title><style>body{margin:0;min-height:100vh;font-family:system-ui,sans-serif;color:#f8fafc;background:radial-gradient(circle at 20% 0,#164e63,transparent 38%),radial-gradient(circle at 90% 20%,#312e81,transparent 35%),#07111f}.wrap{width:min(1000px,94%);margin:auto;padding:28px 0 60px}.hero{margin-top:30px;background:#101d31dd;border:1px solid #ffffff18;border-radius:24px;padding:26px;display:flex;align-items:center;gap:20px}.avatar{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#111827;font-size:1.7rem;font-weight:950}.muted{color:#94a3b8}.id{font-family:ui-monospace,monospace;font-size:.8rem;color:#cbd5e1}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px;margin-top:15px}.card{background:#101d31dd;border:1px solid #ffffff18;border-radius:20px;padding:20px}.metric b{display:block;font-size:1.8rem;margin-top:5px}.list{margin-top:12px}.item{padding:12px 0;border-bottom:1px solid #ffffff12}.item:last-child{border:0}.tag{display:inline-block;background:#334155;padding:4px 8px;border-radius:999px;font-size:.72rem}.danger{color:#fca5a5}@media(max-width:600px){.hero{align-items:flex-start}.avatar{width:60px;height:60px}}
</style></head><body><main class="wrap"><div id="profileState" class="card">Loading account…</div><section id="content" style="display:none"><div class="hero"><div class="avatar" id="avatar">P</div><div><h1 id="name">Player</h1><div class="id" id="playerId">Player ID —</div><div class="muted" id="email"></div></div></div><div class="cards"><div class="card metric"><span class="muted">💰 Balance</span><b id="balance">0 cr</b></div><div class="card metric"><span class="muted">🎮 Games played</span><b id="games">—</b></div><div class="card metric"><span class="muted">🏆 Wins</span><b id="wins">—</b></div><div class="card metric"><span class="muted">🎟️ Tickets</span><b id="tickets">—</b></div></div><div class="cards"><section class="card" id="wins"><h2>🏆 Recent results</h2><div id="winList" class="list muted">Loading…</div></section><section class="card" id="history"><h2>📜 Account activity</h2><div id="historyList" class="list muted">Loading…</div></section></div><section class="card" id="settings"><h2>⚙️ Account</h2><p class="muted">Your public Player ID is safe to share for identifying your account. Your Supabase account UUID remains private.</p><p class="id" id="uuid"></p></section></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const sb=createClient('https://uesymduyouwdrjedzqfr.supabase.co','sb_publishable_6uWbMVr4O7NEfPLFBPpejQ_rnpcR2M2'),$=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));function initials(s){return String(s||'P').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'P'}async function load(){const{data}=await sb.auth.getSession();if(!data.session){$('profileState').innerHTML='Please log in to view your profile.';return}const u=data.session.user,pr=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle(),wa=await sb.from('wallets').select('balance').eq('user_id',u.id).maybeSingle();const p=pr.data||{};$('profileState').style.display='none';$('content').style.display='block';const name=p.display_name||p.username||u.email;$('name').textContent=name;$('email').textContent=u.email||'';$('playerId').textContent='Player ID '+(p.player_id||'—');$('avatar').textContent=initials(name);$('balance').textContent=Number(wa.data?.balance||0).toLocaleString()+' cr';$('uuid').textContent='Account UUID: '+u.id;let tickets=0;const lt=await sb.from('lottery_tickets').select('id',{count:'exact',head:true}).eq('user_id',u.id);tickets=lt.count||0;$('tickets').textContent=tickets.toLocaleString();const wt=await sb.from('wallet_transactions').select('amount,type,note,created_at').eq('user_id',u.id).order('created_at',{ascending:false}).limit(12);$('historyList').innerHTML=wt.error?'History unavailable.':(wt.data||[]).map(x=>`<div class="item"><b>${esc(x.type)}</b> ${x.amount>0?'+':''}${Number(x.amount||0).toLocaleString()} cr<br><span class="muted">${esc(x.note||'')} · ${new Date(x.created_at).toLocaleString()}</span></div>`).join('')||'No wallet activity yet.';const sc=await sb.from('scores').select('game,moves,seconds,created_at').eq('user_id',u.id).order('created_at',{ascending:false}).limit(12);$('games').textContent=(sc.data||[]).length;$('wins').textContent='—';$('winList').innerHTML=sc.error?'Results unavailable.':(sc.data||[]).map(x=>`<div class="item"><span class="tag">${esc(x.game)}</span> <b>${Number(x.moves||0).toLocaleString()}</b> score · ${Number(x.seconds||0)}s<br><span class="muted">${new Date(x.created_at).toLocaleString()}</span></div>`).join('')||'No results yet.'}load();</script><script type="module" src="account.js"></script></body></html>
