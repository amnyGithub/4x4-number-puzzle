name: Install universal account banner
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[account-banner]')"
    steps:
      - uses: actions/checkout@v4
      - name: Install banner script
        run: |
          for f in *.html; do
            if [ "$f" != "profile.html" ] && ! grep -q 'src="account.js"' "$f"; then
              sed -i 's#</body>#<script type="module" src="account.js"></script></body>#' "$f"
            fi
          done
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: install universal account banner [account-banner]'
          git push