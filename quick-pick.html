<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick Pick Arcade</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#07111f;color:#f8fafc}.wrap{width:min(1000px,94%);margin:auto;padding:30px 0 60px}.hero{padding:24px;border:1px solid #ffffff18;border-radius:24px;background:linear-gradient(135deg,#10233b,#111827);margin-bottom:18px}.hero h1{font-size:clamp(2rem,6vw,3.5rem);margin:0}.hero p{color:#94a3b8;max-width:650px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{background:#101d31;border:1px solid #ffffff18;border-radius:18px;padding:18px}.icon{font-size:2rem}.card h2{margin:8px 0 4px}.muted{color:#94a3b8}.meta{display:flex;gap:7px;flex-wrap:wrap;margin:13px 0}.chip{padding:5px 8px;border-radius:8px;background:#24344b;font-size:.75rem}.btn{display:inline-block;border:0;border-radius:10px;padding:10px 14px;background:#fbbf24;color:#111827;font-weight:900;text-decoration:none}.disabled{opacity:.5;pointer-events:none}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.home{color:#fbbf24;text-decoration:none;font-weight:800}</style></head><body><main class="wrap"><div class="top"><b>NUMBER<span style="color:#fbbf24">ARCADE</span></b><a class="home" href="index.html">Home</a></div><section class="hero"><h1>🎯 Quick Pick</h1><p>Choose your number-draw game. Each game has its own ticket size, price, draw speed and prize configuration. All balances are virtual game credits.</p></section><section id="games" class="grid"><div class="card"><div class="muted">Loading games…</div></div></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';import'./account.js';const sb=createClient('https://uesymduyouwdrjedzqfr.supabase.co','sb_publishable_6uWbMVr4O7NEfPLFBPpejQ_rnpcR2M2');const icons={'quick-pick-10':'⚡','quick-pick-20':'🔥','quick-pick-50':'🎯','quick-pick-100':'💎','quick-pick-lucky-3':'🍀'};const order=['quick-pick-10','quick-pick-20','quick-pick-50','quick-pick-100','quick-pick-lucky-3'];const games=document.getElementById('games');const {data,error}=await sb.from('game_config').select('game,config').eq('scope','game').in('game',order);if(error){games.innerHTML='<div class="card">Unable to load Quick Pick games.</div>'}else{const map=Object.fromEntries((data||[]).map(x=>[x.game,x.config||{}]));games.innerHTML=order.map(code=>{const c=map[code]||{};const enabled=c.enabled!==false;const mode=c.mode||'pool';const link=mode==='pick3'?'#':`quick-pick-game.html?game=${encodeURIComponent(code)}`;const state=enabled&&link!=='#'?'Play now':'Coming soon';return `<article class="card"><div class="icon">${icons[code]||'🎲'}</div><h2>${c.title||code}</h2><div class="muted">${c.subtitle||'Number draw game'}</div><div class="meta">${mode==='pool'?`<span class="chip">${c.ticket_count||'—'} numbers</span><span class="chip">${Number(c.ticket_price||0).toLocaleString()} credits</span>`:'<span class="chip">3 digits</span><span class="chip">5 credits</span>'}</div><a class="btn ${enabled&&link!=='#'?'':'disabled'}" href="${link}">${state}</a></article>`}).join('')}</script></body></html>
