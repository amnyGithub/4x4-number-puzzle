<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick Pick Admin</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#07111f;color:#f8fafc}.wrap{width:min(1100px,94%);margin:auto;padding:25px 0 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.card{background:#101d31;border:1px solid #ffffff18;border-radius:18px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field input,.field select{padding:10px;background:#07111f;color:#fff;border:1px solid #475569;border-radius:9px}.btn{border:0;border-radius:10px;padding:10px 14px;background:#fbbf24;color:#111827;font-weight:900;cursor:pointer}.secondary{background:#334155;color:#fff}.muted{color:#94a3b8}.msg{color:#fbbf24;min-height:22px}.game{border-top:1px solid #ffffff18;padding-top:16px;margin-top:16px}.game:first-child{border-top:0;margin-top:0}.actions{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><main class="wrap"><div class="top"><div><h1>🎯 Quick Pick Admin</h1><div class="muted">Configure each Quick Pick game independently.</div></div><div class="actions"><a class="btn secondary" href="admin-center.html">Admin Center</a><a class="btn secondary" href="quick-pick.html">Player Lobby</a></div></div><div id="access" class="card">Checking administrator access…</div><section id="app" style="display:none"><div class="card"><h2>Game configurations</h2><div id="games">Loading…</div></div><p id="msg" class="msg"></p></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';import'./account.js';const sb=createClient('https://uesymduyouwdrjedzqfr.supabase.co','sb_publishable_6uWbMVr4O7NEfPLFBPpejQ_rnpcR2M2');const codes=['quick-pick-10','quick-pick-20','quick-pick-50','quick-pick-100'];const $=x=>document.getElementById(x);const s=(x,v)=>{const e=$(x);if(e.type==='checkbox')e.checked=!!v;else e.value=v??''};const v=x=>{const e=$(x);return e.type==='checkbox'?e.checked:e.type==='number'?Number(e.value):e.value};const id=(c,k)=>`${c.replaceAll('-','_')}_${k}`;async function init(){const sess=(await sb.auth.getSession()).data.session;if(!sess){$('access').textContent='Please log in as administrator.';return}const a=await sb.rpc('is_admin');if(a.error||!a.data){$('access').textContent='Administrator access required.';return}$('access').style.display='none';$('app').style.display='block';const q=await sb.from('game_config').select('game,config').eq('scope','game').in('game',codes);const map=Object.fromEntries((q.data||[]).map(x=>[x.game,x.config||{}]));$('games').innerHTML=codes.map(c=>{const x=map[c]||{};return `<div class="game"><h3>${x.title||c}</h3><div class="grid"><label class="field">Enabled<input id="${id(c,'enabled')}" type="checkbox"></label><label class="field">Title<input id="${id(c,'title')}"></label><label class="field">Subtitle<input id="${id(c,'subtitle')}"></label><label class="field">Number count<input id="${id(c,'ticket_count')}" type="number" min="2" max="10000"></label><label class="field">Ticket price<input id="${id(c,'ticket_price')}" type="number" min="1"></label><label class="field">Prize model<select id="${id(c,'prize_mode')}"><option value="fixed">Fixed</option><option value="progressive">Progressive</option><option value="both">Hybrid</option></select></label><label class="field">Fixed prize<input id="${id(c,'fixed_prize')}" type="number" min="0"></label><label class="field">Progressive %<input id="${id(c,'progressive_percent')}" type="number" min="0" max="100" step="0.001"></label><label class="field">Starting jackpot<input id="${id(c,'jackpot_seed')}" type="number" min="0"></label><label class="field">Max tickets/player<input id="${id(c,'max_tickets_per_player')}" type="number" min="1"></label><label class="field">Draw mode<select id="${id(c,'draw_mode')}"><option value="immediate">Immediate</option><option value="countdown">Countdown</option><option value="manual_video">Manual video</option></select></label><label class="field">Sold-out action<select id="${id(c,'sold_out_action')}"><option value="draw">Draw</option><option value="countdown">Countdown</option><option value="manual_video">Manual video</option></select></label><label class="field">Countdown seconds<input id="${id(c,'countdown_seconds')}" type="number" min="0"></label><label class="field">Auto-open next round<input id="${id(c,'auto_next_round')}" type="checkbox"></label></div><p><button class="btn" data-save="${c}">Save ${x.title||c}</button></p></div>`}).join('');for(const c of codes){const x=map[c]||{};['enabled','title','subtitle','ticket_count','ticket_price','prize_mode','fixed_prize','progressive_percent','jackpot_seed','max_tickets_per_player','draw_mode','sold_out_action','countdown_seconds','auto_next_round'].forEach(k=>s(id(c,k),x[k]))}document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{const c=b.dataset.save;const keys=['enabled','title','subtitle','ticket_count','ticket_price','prize_mode','fixed_prize','progressive_percent','jackpot_seed','max_tickets_per_player','draw_mode','sold_out_action','countdown_seconds','auto_next_round'];const next={};keys.forEach(k=>next[k]=v(id(c,k)));next.mode='pool';b.disabled=true;const r=await sb.from('game_config').update({config:next,updated_at:new Date().toISOString()}).eq('game',c).eq('scope','game');b.disabled=false;$('msg').textContent=r.error?r.error.message:`${c} saved.`})}init()</script></body></html>
